<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>オンライン早押しクイズ</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111827;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 30px 20px;
}

h1 {
    margin-bottom: 25px;
}

button {
    border: none;
    border-radius: 10px;
    padding: 12px 25px;
    font-size: 18px;
    cursor: pointer;
}

input, select {
    padding: 12px;
    border-radius: 8px;
    border: none;
    font-size: 16px;
    margin: 5px;
}

#lobby {
    background: #1f2937;
    padding: 25px;
    border-radius: 15px;
    margin-bottom: 25px;
}

#game {
    display: none;
}

#roomInfo {
    font-size: 18px;
    margin-bottom: 20px;
    color: #93c5fd;
}

#players {
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
    margin: 20px 0;
}

.player {
    background: #1f2937;
    border-radius: 12px;
    padding: 15px 30px;
    min-width: 180px;
}

.player-name {
    font-size: 20px;
}

.score {
    font-size: 30px;
    margin-top: 5px;
}

#questionNumber {
    color: #9ca3af;
    margin-bottom: 20px;
}

#question {
    min-height: 180px;
    display: flex;
    justify-content: center;
    align-items: center;

    background: #1f2937;
    border-radius: 15px;
    padding: 30px;

    font-size: 32px;
    line-height: 1.6;
    word-break: break-all;
}

#answer {
    margin-top: 20px;
    font-size: 28px;
    color: #60a5fa;
    min-height: 45px;
}

#buzz {
    margin-top: 30px;
    width: 250px;
    height: 100px;

    border: none;
    border-radius: 50%;

    background: #ef4444;
    color: white;

    font-size: 30px;
    font-weight: bold;

    cursor: pointer;

    box-shadow: 0 8px 0 #991b1b;
}

#buzz:active {
    transform: translateY(8px);
    box-shadow: none;
}

#buzz:disabled {
    background: #4b5563;
    box-shadow: none;
    cursor: not-allowed;
}

#result {
    margin-top: 25px;
    font-size: 24px;
    min-height: 40px;
}

#next {
    display: none;
    margin-top: 20px;
    background: #3b82f6;
    color: white;
}

#status {
    margin-top: 15px;
    color: #fbbf24;
}

#createRoom {
    background: #22c55e;
    color: white;
}

#joinRoom {
    background: #3b82f6;
    color: white;
}

#startOnlineGame {
    background: #8b5cf6;
    color: white;
    display: none;
}

#lobbyMessage {
    margin-top: 15px;
}
</style>
</head>

<body>

<div class="container">

<h1>⚡ オンライン早押しクイズ</h1>

<!-- ロビー -->
<div id="lobby">

    <div>
        <input id="playerName" placeholder="名前を入力">
    </div>

    <div>
        <select id="questionCount">
            <option value="10">10問</option>
            <option value="30">30問</option>
            <option value="50">50問</option>
            <option value="100">100問</option>
        </select>
    </div>

    <br>

    <button id="createRoom" onclick="createRoom()">
        🏠 ルームを作る
    </button>

    <hr style="margin:25px 0;border-color:#374151;">

    <input id="roomIdInput" placeholder="ルームID">

    <button id="joinRoom" onclick="joinRoom()">
        🔑 参加する
    </button>

    <div id="lobbyMessage"></div>

    <button id="startOnlineGame" onclick="startOnlineGame()">
        ▶ ゲーム開始
    </button>

</div>


<!-- ゲーム -->
<div id="game">

    <div id="roomInfo"></div>

    <div id="questionNumber">
        1 / 10
    </div>

    <div id="question">
        問題を読み込んでいます
    </div>

    <div id="answer"></div>

    <button id="buzz" onclick="buzz()">
        🔴 早押し！
    </button>

    <div id="result"></div>

    <button id="next" onclick="nextQuestion()">
        次の問題
    </button>

    <div id="players">

        <div class="player">
            <div id="player1Name" class="player-name">
                プレイヤー1
            </div>

            <div id="score1" class="score">
                0
            </div>
        </div>

        <div class="player">
            <div id="player2Name" class="player-name">
                プレイヤー2
            </div>

            <div id="score2" class="score">
                0
            </div>
        </div>

    </div>

    <div id="status"></div>

</div>

</div>


<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>


<script>

// =====================================================
// Firebase設定（ご自身のキー情報を組み込み済み）
// =====================================================

const firebaseConfig = {
  apiKey: "AIzaSyDLxNFFgvIOXcnqpw7pQwyPvCeUPXTH0cM",
  authDomain: "hayaosiquiz.firebaseapp.com",
  databaseURL: "https://hayaosiquiz-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "hayaosiquiz",
  storageBucket: "hayaosiquiz.firebasestorage.app",
  messagingSenderId: "597532864724",
  appId: "1:597532864724:web:66f89b234538dce9400b41",
  measurementId: "G-2R8PWSJN80"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();


// =====================================================
// 問題データ
// =====================================================

const questions = [
    { text: "日本で一番高い山は何でしょう？", answer: "富士山" },
    { text: "1年は何日でしょう？", answer: "365日" },
    { text: "日本の首都はどこでしょう？", answer: "東京" },
    { text: "水の化学式は何でしょう？", answer: "H2O" },
    { text: "地球が太陽の周りを一周するのにかかる時間は約何日でしょう？", answer: "365日" },
    { text: "日本で一番大きい都道府県はどこでしょう？", answer: "北海道" },
    { text: "三角形の内角の和は何度でしょう？", answer: "180度" },
    { text: "英語で「猫」は何でしょう？", answer: "cat" },
    { text: "太陽系で最も大きい惑星は何でしょう？", answer: "木星" },
    { text: "日本の国鳥は何でしょう？", answer: "キジ" }
];


// =====================================================
// グローバル変数
// =====================================================

let roomId = null;
let playerId = null;
let isHost = false;
let roomRef = null;
let gameData = null;

// 文字のタイピング演出用
let typingInterval = null;
let currentDisplayedQuestionIndex = -1;
let currentTextLength = 0;
const CHAR_SPEED = 120; // 1文字あたりの表示スピード(ミリ秒)


// =====================================================
// プレイヤーID生成
// =====================================================

function generatePlayerId() {
    return "player_" + Math.random().toString(36).substring(2) + Date.now();
}


// =====================================================
// ルーム作成
// =====================================================

function createRoom() {
    const name = document.getElementById("playerName").value.trim();
    if (!name) {
        alert("名前を入力してください");
        return;
    }

    playerId = generatePlayerId();
    isHost = true;
    roomId = Math.random().toString(36).substring(2, 8).toUpperCase();
    roomRef = db.ref("rooms/" + roomId);

    const count = Number(document.getElementById("questionCount").value);

    const roomData = {
        host: playerId,
        questionCount: count,
        state: "waiting",
        currentQuestion: 0,
        buzzedBy: null,
        players: {
            [playerId]: {
                name: name,
                score: 0
            }
        }
    };

    roomRef.set(roomData);

    document.getElementById("lobbyMessage").innerHTML =
        `ルームID：<strong>${roomId}</strong><br>
        このIDを友達に送ってください。<br>
        友達の参加を待っています。`;

    listenRoom();
}


// =====================================================
// ルーム参加
// =====================================================

function joinRoom() {
    const name = document.getElementById("playerName").value.trim();
    const input = document.getElementById("roomIdInput").value.trim();

    if (!name) {
        alert("名前を入力してください");
        return;
    }

    if (!input) {
        alert("ルームIDを入力してください");
        return;
    }

    roomId = input.toUpperCase();
    playerId = generatePlayerId();
    isHost = false;
    roomRef = db.ref("rooms/" + roomId);

    roomRef.once("value").then(snapshot => {
        if (!snapshot.exists()) {
            alert("そのルームは存在しません");
            return;
        }

        const data = snapshot.val();

        if (data.players && Object.keys(data.players).length >= 2) {
            alert("このルームは満員です");
            return;
        }

        return roomRef.child("players/" + playerId).set({
            name: name,
            score: 0
        });
    }).then(() => {
        document.getElementById("lobbyMessage").textContent =
            "ルームに参加しました。ホストがゲームを開始するのを待っています。";
        listenRoom();
    });
}


// =====================================================
// ルーム監視
// =====================================================

function listenRoom() {
    roomRef.on("value", snapshot => {
        if (!snapshot.exists()) return;

        gameData = snapshot.val();
        const players = gameData.players || {};
        const playerKeys = Object.keys(players);

        // 2人揃ったらホストに開始ボタンを表示
        if (isHost && playerKeys.length === 2 && gameData.state === "waiting") {
            document.getElementById("startOnlineGame").style.display = "inline-block";
            document.getElementById("lobbyMessage").textContent = "2人揃いました！ゲームを開始できます。";
        }

        // ゲーム中画面の制御
        if (gameData.state === "playing") {
            document.getElementById("lobby").style.display = "none";
            document.getElementById("game").style.display = "block";
            updateGame();
        }

        // 終了時
        if (gameData.state === "finished") {
            finishGame();
        }
    });
}


// =====================================================
// ゲーム開始
// =====================================================

function startOnlineGame() {
    if (!isHost) return;

    const players = gameData.players || {};
    if (Object.keys(players).length !== 2) {
        alert("2人揃ってから開始してください");
        return;
    }

    roomRef.update({
        state: "playing",
        currentQuestion: 0,
        buzzedBy: null,
        result: null
    });
}


// =====================================================
// ゲーム表示・みんはや風問題表示制御
// =====================================================

function updateGame() {
    if (!gameData) return;

    const players = gameData.players || {};
    const playerKeys = Object.keys(players);

    // プレイヤー名 & スコア更新
    if (playerKeys[0]) {
        document.getElementById("player1Name").textContent = players[playerKeys[0]].name;
        document.getElementById("score1").textContent = players[playerKeys[0]].score || 0;
    }
    if (playerKeys[1]) {
        document.getElementById("player2Name").textContent = players[playerKeys[1]].name;
        document.getElementById("score2").textContent = players[playerKeys[1]].score || 0;
    }

    const index = gameData.currentQuestion || 0;
    const count = gameData.questionCount;

    if (index >= count) {
        finishGame();
        return;
    }

    const q = questions[index % questions.length];

    document.getElementById("questionNumber").textContent = `${index + 1} / ${count}`;

    // --- 【みんはや風演出制御】 ---
    
    // 新しい問題に切り替わった場合
    if (currentDisplayedQuestionIndex !== index) {
        currentDisplayedQuestionIndex = index;
        currentTextLength = 0;
        clearInterval(typingInterval);
        document.getElementById("question").textContent = "";

        // 文字を1文字ずつ進めるタイマー設定
        typingInterval = setInterval(() => {
            if (currentTextLength < q.text.length) {
                currentTextLength++;
                document.getElementById("question").textContent = q.text.substring(0, currentTextLength);
            } else {
                clearInterval(typingInterval);
            }
        }, CHAR_SPEED);
    }

    // 早押しされたかどうかの状態判定
    if (gameData.buzzedBy) {
        // 早押しされたらタイピング演出をストップ
        clearInterval(typingInterval);
        document.getElementById("buzz").disabled = true;

        const buzzer = players[gameData.buzzedBy];
        if (buzzer) {
            document.getElementById("status").textContent = `⚡ ${buzzer.name} が早押ししました！`;
        }
    } else {
        // まだ誰も押していない場合
        if (!gameData.result) {
            document.getElementById("buzz").disabled = false;
            document.getElementById("status").textContent = "早押ししてください！";
        }
    }

    // 結果（正解・不正解）が出た場合
    if (gameData.result) {
        // 結果が出たら問題文を最後まで表示させる
        clearInterval(typingInterval);
        document.getElementById("question").textContent = q.text;

        document.getElementById("result").textContent = gameData.result.message;
        document.getElementById("answer").textContent = `答え：${q.answer}`;
        document.getElementById("next").style.display = "inline-block";
        document.getElementById("buzz").disabled = true;
    } else {
        document.getElementById("result").textContent = "";
        document.getElementById("answer").textContent = "";
        document.getElementById("next").style.display = "none";
    }
}


// =====================================================
// 早押しボタン処理
// =====================================================

// =====================================================
// 早押しボタン処理（同時押し対策済み）
// =====================================================

function buzz() {
    if (!roomRef || !gameData) return;
    if (gameData.buzzedBy) return;

    document.getElementById("buzz").disabled = true;
    const buzzRef = roomRef.child("buzzedBy");

    // ミリ秒単位で一番最初に着いたリクエストだけを受け付ける
    buzzRef.transaction(current => {
        if (current === null) {
            return playerId;
        }
        return;
    }, (error, committed, snapshot) => {
        if (error) {
            console.error(error);
            return;
        }

        // 自分が一番乗りだと確定した場合のみダイアログを開く
        if (committed && snapshot.val() === playerId) {
            setTimeout(() => {
                const index = gameData.currentQuestion || 0;
                const q = questions[index % questions.length];
                const userAnswer = prompt("答えを入力してください");

                if (userAnswer === null) {
                    roomRef.update({ buzzedBy: null });
                    return;
                }

                const correct = userAnswer.trim().toLowerCase() === q.answer.trim().toLowerCase();
                const playerScore = (gameData.players[playerId] && gameData.players[playerId].score) || 0;

                if (correct) {
                    roomRef.update({
                        result: { message: `⭕ ${gameData.players[playerId]?.name || 'プレイヤー'}が正解！` },
                        [`players/${playerId}/score`]: playerScore + 10
                    });
                } else {
                    roomRef.update({
                        result: { message: `❌ ${gameData.players[playerId]?.name || 'プレイヤー'}が不正解！` },
                        [`players/${playerId}/score`]: playerScore - 5,
                        buzzedBy: null
                    });
                }
            }, 50);
        }
    });
}
    if (!roomRef || !gameData) return;
    if (gameData.buzzedBy) return;

    // ボタンを連打できないように即座に無効化
    document.getElementById("buzz").disabled = true;

    const buzzRef = roomRef.child("buzzedBy");

    // Firebase Transactionでミリ秒単位の先押し判定を行う
    buzzRef.transaction(current => {
        if (current === null) {
            return playerId; // 自分が一番乗りなら書き込む
        }
        return; // すでに誰かが押していたら何もしない（キャンセル）
    }, (error, committed, snapshot) => {
        if (error) {
            console.error(error);
            return;
        }

        // 自分が確実に「一番乗り」だった場合のみ回答処理を実行
        if (committed && snapshot.val() === playerId) {
            openAnswerPrompt();
        }
    });
}() {
    if (!roomRef || !gameData) return;
    if (gameData.buzzedBy) return;

    // Firebase Transactionで先押し判定を行う
    const buzzRef = roomRef.child("buzzedBy");

    buzzRef.transaction(current => {
        if (current === null) {
            return playerId;
        }
        return; // すでに誰かが押していたら何もしない
    }, (error, committed) => {
        if (error) {
            console.error(error);
        }
    });
}


// =====================================================
// キーボード (Space) での早押し入力対応
// =====================================================

document.addEventListener("keydown", (event) => {
    if (event.code === "Space") {
        // モーダル表示中や入力フォームへの入力時は発火しないようにする
        if (document.activeElement.tagName === "INPUT") return;

        const buzzBtn = document.getElementById("buzz");
        if (buzzBtn && !buzzBtn.disabled && gameData && gameData.state === "playing") {
            event.preventDefault();
            buzz();
        }
    }
});


// =====================================================
// 回答入力ダイアログ
// =====================================================

document.getElementById("buzz").addEventListener("click", () => {
    setTimeout(() => {
        if (!gameData) return;
        if (gameData.buzzedBy !== playerId) return;
        if (gameData.result) return;

        const index = gameData.currentQuestion || 0;
        const q = questions[index % questions.length];

        const userAnswer = prompt("答えを入力してください");

        if (userAnswer === null) {
            return;
        }

        const correct = userAnswer.trim().toLowerCase() === q.answer.trim().toLowerCase();
        const playerScore = gameData.players[playerId].score || 0;

        if (correct) {
            roomRef.update({
                result: {
                    message: "⭕ 正解！ +10点",
                    playerId: playerId,
                    correct: true
                },
                [`players/${playerId}/score`]: playerScore + 10
            });
        } else {
            roomRef.update({
                result: {
                    message: `❌ 不正解！ 正解は「${q.answer}」`,
                    playerId: playerId,
                    correct: false
                },
                [`players/${playerId}/score`]: playerScore - 5
            });
        }
    }, 100);
});


// =====================================================
// 次の問題に進む
// =====================================================

function nextQuestion() {
    if (!isHost) return;

    const next = (gameData.currentQuestion || 0) + 1;

    if (next >= gameData.questionCount) {
        roomRef.update({
            state: "finished"
        });
        return;
    }

    roomRef.update({
        currentQuestion: next,
        buzzedBy: null,
        result: null
    });
}


// =====================================================
// ゲーム終了処理
// =====================================================

function finishGame() {
    clearInterval(typingInterval);

    document.getElementById("questionNumber").textContent = "ゲーム終了！";
    document.getElementById("question").textContent = "🎉 結果発表";

    const players = gameData.players || {};
    const playerKeys = Object.keys(players);

    let resultText = "";
    playerKeys.forEach(key => {
        resultText += `${players[key].name}：${players[key].score || 0}点 `;
    });

    document.getElementById("answer").textContent = resultText;
    document.getElementById("buzz").disabled = true;
    document.getElementById("next").style.display = "none";
}

</script>

</body>
</html>
