<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>リアルタイム早押しクイズ</title>
    <style>
        :root {
            --bg-color: #121826;
            --card-bg: #1b2333;
            --text-color: #f3f4f6;
            --accent-color: #60a5fa;
            --buzz-btn: #ef4444;
            --buzz-btn-active: #dc2626;
            --success: #10b981;
            --warning: #f59e0b;
            --border-color: #2d3748;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 32px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            border: 1px solid var(--border-color);
        }

        h1 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 24px;
            color: var(--accent-color);
            font-size: 1.75rem;
            font-weight: 700;
        }

        .input-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.875rem;
            color: #9ca3af;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background-color: #121826;
            color: #fff;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            background-color: #2563eb;
            color: white;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn:disabled {
            background-color: #374151;
            cursor: not-allowed;
            transform: none;
            opacity: 0.6;
        }

        .btn-secondary {
            background-color: #374151;
        }

        .btn-buzz {
            background-color: var(--buzz-btn);
            color: white;
            font-size: 2.25rem;
            font-weight: 800;
            padding: 0;
            border-radius: 50%;
            width: 200px;
            height: 200px;
            margin: 24px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 0 #991b1b, 0 15px 25px rgba(239, 68, 68, 0.3);
            cursor: pointer;
            user-select: none;
            border: none;
            transition: all 0.1s;
        }

        .btn-buzz:active:not(:disabled) {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #991b1b, 0 5px 10px rgba(239, 68, 68, 0.3);
        }

        .btn-buzz:disabled {
            background-color: #4b5563;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        .header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #121826;
            padding: 12px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 0.95rem;
            border: 1px solid var(--border-color);
        }

        .question-box {
            background-color: #121826;
            border-radius: 12px;
            padding: 24px;
            min-height: 110px;
            font-size: 1.25rem;
            line-height: 1.6;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
            word-break: break-all;
        }

        .status-box {
            text-align: center;
            font-size: 1.15rem;
            font-weight: 700;
            min-height: 36px;
            color: var(--warning);
            margin-bottom: 16px;
        }

        .scoreboard {
            margin-top: 32px;
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
        }

        .scoreboard h3 {
            margin-top: 0;
            margin-bottom: 12px;
            font-size: 1rem;
            color: #9ca3af;
        }

        .player-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .player-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 16px;
            background-color: #121826;
            border-radius: 8px;
            margin-bottom: 8px;
            border: 1px solid var(--border-color);
        }

        .hidden {
            display: none !important;
        }
    </style>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

<div class="container">
    <h1>⚡ リアルタイム早押しクイズ</h1>

    <!-- 設定画面 -->
    <div id="setup-screen">
        <div class="input-group">
            <label for="player-name">プレイヤー名</label>
            <input type="text" id="player-name" placeholder="名前を入力してください">
        </div>
        <div class="input-group">
            <label for="room-id">ルームID</label>
            <input type="text" id="room-id" placeholder="作成時は空欄でOK">
        </div>
        <div class="btn-group">
            <button class="btn" onclick="createRoom()">🏠 ルーム作成</button>
            <button class="btn btn-secondary" onclick="joinRoom()">🔑 ルーム参加</button>
        </div>
    </div>

    <!-- ゲーム画面 -->
    <div id="game-screen" class="hidden">
        <div class="header-info">
            <div>ルーム: <span id="display-room-id" style="color: var(--accent-color); font-weight: bold;"></span></div>
            <div>問題 <span id="question-num">1</span> / 3</div>
        </div>

        <div class="question-box" id="question-display">問題を読み込み中...</div>

        <button id="buzz-btn" class="btn-buzz" onclick="buzz()">押す！</button>

        <div class="status-box" id="status-display"></div>

        <div id="host-controls" class="hidden">
            <button class="btn" onclick="nextQuestion()">次の問題へ ▶</button>
        </div>

        <div class="scoreboard">
            <h3>スコアボード</h3>
            <ul id="player-list" class="player-list"></ul>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        databaseURL: "https://hayaosiquiz-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    let roomRef = null;
    let playerId = "player_" + Math.random().toString(36).substr(2, 9);
    let playerName = "";
    let isHost = false;
    let gameData = null;
    let typingTimer = null;

    const questions = [
        { q: "日本で一番高い山は？", answer: "富士山" },
        { q: "リンゴを英語で言うと？", answer: "apple" },
        { q: "太陽系で最も大きい惑星は？", answer: "木星" }
    ];

    function createRoom() {
        playerName = document.getElementById("player-name").value.trim() || "ゲスト";
        const roomId = Math.random().toString(36).substr(2, 6).toUpperCase();
        isHost = true;
        setupRoom(roomId);
    }

    function joinRoom() {
        playerName = document.getElementById("player-name").value.trim() || "ゲスト";
        const roomId = document.getElementById("room-id").value.trim().toUpperCase();
        if (!roomId) return alert("ルームIDを入力してください");
        isHost = false;
        setupRoom(roomId);
    }

    function setupRoom(roomId) {
        roomRef = db.ref("rooms/" + roomId);
        document.getElementById("setup-screen").classList.add("hidden");
        document.getElementById("game-screen").classList.remove("hidden");
        document.getElementById("display-room-id").textContent = roomId;

        if (isHost) {
            document.getElementById("host-controls").classList.remove("hidden");
            roomRef.set({
                currentQuestion: 0,
                buzzedBy: null,
                result: null,
                players: { [playerId]: { name: playerName, score: 0 } }
            });
        } else {
            roomRef.child("players/" + playerId).set({ name: playerName, score: 0 });
        }

        listenRoom();
    }

    function listenRoom() {
        roomRef.on("value", snapshot => {
            const prevData = gameData;
            gameData = snapshot.val();
            if (!gameData) return;

            // 問題番号更新 & タイピング表示
            const qIndex = gameData.currentQuestion || 0;
            document.getElementById("question-num").textContent = qIndex + 1;

            if (!prevData || prevData.currentQuestion !== qIndex) {
                startTypingQuestion(questions[qIndex % questions.length]?.q || "");
            }

            // 早押しボタンの活性化コントロール
            const buzzBtn = document.getElementById("buzz-btn");
            if (gameData.buzzedBy) {
                buzzBtn.disabled = true;
            } else {
                buzzBtn.disabled = false;
            }

            // 状況メッセージ表示
            const statusDisplay = document.getElementById("status-display");
            if (gameData.result) {
                statusDisplay.textContent = gameData.result.message;
            } else if (gameData.buzzedBy) {
                const buzzerName = gameData.players[gameData.buzzedBy]?.name || "誰か";
                statusDisplay.textContent = `🔔 ${buzzerName} が早押ししました！回答中...`;
            } else {
                statusDisplay.textContent = "";
            }

            // スコアボード更新
            updateScoreboard(gameData.players || {});
        });
    }

    // 問題文を1文字ずつタイピング表示する処理
    function startTypingQuestion(text) {
        if (typingTimer) clearInterval(typingTimer);
        const display = document.getElementById("question-display");
        display.textContent = "";
        let i = 0;
        typingTimer = setInterval(() => {
            if (i < text.length) {
                display.textContent += text.charAt(i);
                i++;
            } else {
                clearInterval(typingTimer);
            }
        }, 100);
    }

    // 【同時押し判定】ミリ秒単位の判定ロジック
    function buzz() {
        if (!roomRef || !gameData) return;
        if (gameData.buzzedBy) return;

        document.getElementById("buzz-btn").disabled = true;
        const buzzRef = roomRef.child("buzzedBy");

        buzzRef.transaction(current => {
            if (current === null) {
                return playerId;
            }
            return;
        }, (error, committed, snapshot) => {
            if (error) {
                console.error(error);
                return;
            }

            if (committed && snapshot.val() === playerId) {
                setTimeout(() => {
                    const index = gameData.currentQuestion || 0;
                    const q = questions[index % questions.length];
                    const userAnswer = prompt("答えを入力してください");

                    if (userAnswer === null) {
                        roomRef.update({ buzzedBy: null });
                        return;
                    }

                    const correct = userAnswer.trim().toLowerCase() === q.answer.trim().toLowerCase();
                    const playerScore = (gameData.players[playerId] && gameData.players[playerId].score) || 0;

                    if (correct) {
                        roomRef.update({
                            result: { message: `⭕ ${playerName} が正解！ (+10点)` },
                            [`players/${playerId}/score`]: playerScore + 10
                        });
                    } else {
                        roomRef.update({
                            result: { message: `❌ ${playerName} が不正解！ (-5点)` },
                            [`players/${playerId}/score`]: playerScore - 5,
                            buzzedBy: null
                        });
                    }
                }, 50);
            }
        });
    }

    function nextQuestion() {
        roomRef.update({
            currentQuestion: (gameData.currentQuestion || 0) + 1,
            buzzedBy: null,
            result: null
        });
    }

    function updateScoreboard(players) {
        const list = document.getElementById("player-list");
        list.innerHTML = "";
        Object.keys(players).forEach(id => {
            const p = players[id];
            const li = document.createElement("li");
            li.className = "player-item";
            li.innerHTML = `<span>${p.name}</span><strong>${p.score || 0}点</strong>`;
            list.appendChild(li);
        });
    }
</script>

</body>
</html>
